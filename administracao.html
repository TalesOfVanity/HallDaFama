<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Tales of Vanity</title><link rel="stylesheet" href="css/global.css?v=71"></head><body><header class="site-header"><nav class="nav"><a class="logo" href="index.html">Tales of Vanity</a><div class="nav-links"><span data-auth-area></span></div></nav></header>
<main class="container section"><div class="section-heading"><span class="eyebrow">Administração</span><h1>Painel Administrativo</h1><p>Gerencie a curadoria e os registros históricos do Hall da Fama.</p></div><p id="admin-portal-status" class="status"></p><div id="admin-stats" class="admin-dashboard-grid"></div>
<div class="admin-editor-grid"><form id="featured-form" class="form-card"><h2>Novo Destaque</h2><label><span>Tipo</span><select name="content_type"><option value="character">Personagem</option><option value="player">Jogador</option><option value="party">Party</option><option value="chronicle">Crônica</option></select></label><label><span>Título</span><input name="title" required></label><label><span>Subtítulo</span><input name="subtitle"></label><label><span>Imagem</span><input name="image_url" placeholder="URL opcional"></label><label><span>Destino</span><input name="target_url" required placeholder="personagem.html?id=..."></label><label><span>Posição</span><input name="position" type="number" min="0" value="0"></label><button class="button">Adicionar Destaque</button></form>
<form id="legacy-form" class="form-card"><h2>Novo Registro de Legado</h2><label><span>Categoria</span><select name="entry_type"><option value="mvp">MVP</option><option value="season">Temporada</option><option value="character">Personagem</option><option value="party">Party</option><option value="event">Momento</option></select></label><label><span>Título</span><input name="title" required></label><label><span>Descrição</span><textarea name="description" rows="4"></textarea></label><label><span>Imagem</span><input name="image_url" placeholder="URL opcional"></label><label><span>Destino</span><input name="target_url" placeholder="URL opcional"></label><label><span>Data</span><input name="happened_at" type="datetime-local"></label><button class="button">Registrar no Legado</button></form></div>
