<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="css/global.css?v=22">
</head>
<body>
<header class="site-header">
  <nav class="nav">
    <a class="logo" href="index.html">Tales of Vanity</a>
  </nav>
</header>

<main class="container">
  <form id="register-form" class="form-card">
    <span class="eyebrow">Novo registro</span>
    <h1>Criar conta</h1>

    <div class="field">
      <label for="display_name">Nome de Player</label>
      <input id="display_name" name="display_name" maxlength="80" placeholder="Nome que será exibido no site" required>
    </div>

    <div class="field">
      <label for="username">@Username</label>
      <input id="username" name="username" minlength="3" maxlength="30" pattern="[a-z0-9._-]{3,30}" placeholder="seu_username" autocomplete="username" required>
      <small>Será seu @ no Hall da Fama. Use de 3 a 30 caracteres: letras minúsculas, números, ponto, hífen ou _.</small>
    </div>

    <div class="field">
      <label for="country">Localidade</label>
      <input id="country" name="country" placeholder="Ex.: Reino Doce, Ooo, São Paulo...">
    </div>

    <fieldset class="character-form-section profile-type-section">
      <legend>Participação no RPG</legend>
      <p class="form-help">Selecione como você participa atualmente. Isso poderá ser alterado depois no seu perfil.</p>
      <label class="choice-row"><input type="radio" name="participation_type" value="interpreter" checked> Intérprete</label>
      <label class="choice-row"><input type="radio" name="participation_type" value="narrator"> Narrador</label>
      <label class="choice-row"><input type="radio" name="participation_type" value="both"> Ambos</label>
    </fieldset>

    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required>
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" minlength="6" required>
    </div>

    <button class="button" type="submit">Criar conta</button>
    <p id="register-status" class="status"></p>
  </form>
</main>

<script type="module" src="js/cadastro.js?v=4"></script>
</body>
</html>
