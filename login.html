<!DOCTYPE html>

<html lang="pt-BR">
<head><script>(function(){try{var t=localStorage.getItem('tov-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}catch(e){}})();</script>
<link id="site-favicon" rel="icon" type="image/png" href="assets/brand/favicon-finn.png">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Entrar — Tales of Vanity</title>
<link href="css/global.css?v=937" rel="stylesheet"/>
</head>
<body>
<header class="site-header">
<nav class="nav">
<a class="logo" href="/">Tales of Vanity</a>
<div class="nav-links">
<a href="/jogadores">Jogadores</a>
<a href="/personagens">Personagens</a>
<a href="/ranking">Ranking</a>
</div>
</nav>
</header>
<main class="container">
<form class="form-card" id="login-form">
<span class="eyebrow">Acesso</span>
<h1>Entrar</h1>
<div class="field">
<label for="identifier">E-mail ou @username</label>
<input autocomplete="username" id="identifier" name="identifier" placeholder="@username ou seu@email.com" required="" type="text"/>
</div>
<div class="field">
<label for="password">Senha</label>
<input autocomplete="current-password" id="password" name="password" required="" type="password"/>
</div>
<button class="button" type="submit">Entrar</button>
<p class="status" id="login-status"></p>
<p>Não possui conta? <a href="/cadastro">Cadastre-se</a>.</p>
</form>
</main>
<script src="js/login.js?v=2" type="module"></script>
<script src="js/ux.js?v=937" type="module"></script></body>
</html>
