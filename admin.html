<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Brasões — Administração</title><link rel="stylesheet" href="css/global.css"></head><body>
<header class="site-header"><nav class="nav"><a class="logo" href="index.html">Tales of Vanity</a><div class="nav-links"><a href="jogadores.html">Jogadores</a>
      <a href="personagens.html">Personagens</a><a href="ranking.html">Ranking</a><a href="clans.html">Partys</a><span data-auth-area></span></div></nav></header>
<main class="container"><section id="admin-content" class="section"><span class="eyebrow">Administração</span><h1>Gerenciar brasões</h1><p>Crie, edite e atribua os brasões qualitativos aos jogadores.</p><p id="admin-status" class="status"></p>
<div class="admin-badge-layout"><form id="badge-form" class="form-card"><h2 id="badge-form-title">Novo brasão</h2><input type="hidden" name="id"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Descrição</label><textarea name="description" rows="4"></textarea></div><div class="field"><label>Categoria</label><input name="category" placeholder="Participação"></div><div class="field"><label>Raridade</label><input name="rarity" placeholder="Comum"></div><div class="field"><label>URL do ícone</label><input name="icon" placeholder="https://..."></div><div class="form-actions"><button class="button" type="submit">Salvar brasão</button><button class="button" id="cancel-badge-edit" type="button" hidden>Cancelar</button></div></form>
<form id="award-form" class="form-card"><h2>Atribuir brasão</h2><div class="field"><label>Jogador</label><select name="player_id" required></select></div><div class="field"><label>Brasão</label><select name="badge_id" required></select></div><button class="button" type="submit">Atribuir ao jogador</button></form></div>
<section class="section"><div class="section-heading"><span class="eyebrow">Catálogo</span><h2>Brasões cadastrados</h2></div><div id="badge-list" class="grid badge-grid"></div></section>
<section class="section"><div class="section-heading"><span class="eyebrow">Concessões</span><h2>Brasões atribuídos</h2></div><div id="award-list" class="grid badge-grid"></div></section>
</section></main><script type="module" src="js/auth.js?v=3"></script><script type="module" src="js/admin.js?v=2"></script></body></html>
