<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar Crônicas — Tales of Vanity</title><link rel="stylesheet" href="css/global.css?v=20"></head><body><header class="site-header"><nav class="nav"><a class="logo" href="index.html">Tales of Vanity</a><div class="nav-links"><a href="cronicas.html">Ver Crônicas</a><span data-auth-area></span></div></nav></header><main class="container section"><div class="section-heading"><span class="eyebrow">Administração</span><h1>Temporadas & Eventos</h1><p>Registre patches, temporadas e acontecimentos que farão parte da linha do tempo oficial.</p></div><section class="admin-split"><form id="season-form" class="panel form-stack"><h2>Nova temporada / patch</h2><input name="name" required maxlength="100" placeholder="Ex.: Temporada 1 — O Primeiro Reino"><textarea name="description" rows="4" placeholder="Contextualize esta fase do RPG."></textarea><div class="request-form-grid"><label>Início<input type="date" name="starts_at"></label><label>Fim<input type="date" name="ends_at"></label><label><input type="checkbox" name="is_current"> Temporada atual</label></div><button class="button">Criar temporada</button><p class="status"></p></form><form id="event-form" class="panel form-stack"><h2>Novo evento canônico</h2><select name="season_id"><option value="">Sem temporada</option></select><input name="title" required maxlength="160" placeholder="Ex.: Fundação da Ordem do Leão"><select name="event_type"><option value="arc">Arco</option><option value="war">Guerra</option><option value="death">Morte</option><option value="party">Party</option><option value="world">Evento mundial</option><option value="other">Outro</option></select><input name="banner_url" placeholder="URL do banner (opcional)"><div class="request-form-grid"><label>Início<input type="date" name="starts_at"></label><label>Fim<input type="date" name="ends_at"></label></div><label>Personagens relacionados<select name="characters" multiple size="6"></select></label><label>Jogadores relacionados<select name="players" multiple size="6"></select></label><label>Brasões relacionados<select name="badges" multiple size="5"></select></label><textarea name="summary" rows="3" placeholder="Resumo curto que aparecerá na linha do tempo."></textarea><textarea name="content" rows="8" placeholder="Relate o acontecimento com os detalhes que devem permanecer no arquivo histórico."></textarea><button class="button">Publicar evento</button><p class="status"></p></form></section><div id="admin-events" class="request-list"></div></main><script type="module" src="js/auth.js?v=20"></script><script type="module" src="js/cronicas-admin.js?v=1"></script></body></html>
